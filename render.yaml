services:
  - type: web
    name: health-copilot-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn praveen.backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: USE_MOCK_AI
        value: "true"
      - key: AI_ENGINE_ROOT
        value: yogesh/healthcare_copilot_AI-Engine-main
      - key: PYTHONPATH
        value: praveen/backend:yogesh/healthcare_copilot_AI-Engine-main
